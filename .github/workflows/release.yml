name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "!v0.5.5"

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref != 'refs/tags/v0.5.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft for verified native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            # NAM Parametric Plugin 0.5.0
            
            Version 0.5.0 updates parametric-model compatibility and corrects the large output-level drop that could occur when enabling an impulse response (IR).
            
            ## What's new
            
            ### New ParaNAM Trainer model format
            - Loads the new `ParametricSlimmableContainer` format produced by current ParaNAM Trainer exports.
            - Preserves compatibility with legacy `HyperA2` and `ParametricOutputGain` models.
            - Supports optional `extensions.linear_volume` curves: the measured clean volume taper is applied **after** the neural model, with smoothing to avoid clicks. Volume-only adjustments do not require regenerating neural-network weights.
            - Keeps Full/Lite model selection, input calibration, session recall, and static NAM export.
            
            ### IR loader: corrected output gain
            - Compensates for the **-18 dB** attenuation previously introduced by AudioDSPTools' IR processing path.
            - Uses the same IR normalization target as the **Compare** page in ParaNAM Trainer: average spectral power across **64 logarithmically spaced bands from 100 Hz to 5 kHz**.
            - Calculates the correction outside the real-time audio thread and updates it when the sample rate changes.
            - Leaves the IR stage optional and keeps the plugin's output-gain control independent.
            
            **Note:** The target is approximately **0 dB average spectral gain** over the comparison band, not a guarantee of identical peak level or perceived loudness for every IR. An IR's frequency response can still change perceived volume.
            
            ### Regression coverage and packaging
            - Adds IR gain-normalization regression tests.
            - Verifies model loading, audio processing, static export, and calibration/control behavior in native builds.
            
            ## Downloads
            
            Seven native packages are built and published only after their platform checks pass:
            
            - **Windows x64:** VST3 and Standalone
            - **macOS universal (Apple Silicon + Intel):** VST3, AU, and Standalone
            - **Linux x86_64:** VST3 and Standalone
            
            Windows and macOS binaries are not code-signed/notarized; see the [README](https://github.com/DLC86/NamParametricPlugin#download) for installation instructions.
            
            This 0.5.0 release follows [v0.4.5](https://github.com/DLC86/NamParametricPlugin/releases/tag/v0.4.5). It is published as a **preview**, consistent with this repository's release workflow, and does not replace the currently marked Latest release.
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fx "project(NamParametricPlugin VERSION $version)" CMakeLists.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "NAM Parametric Plugin $version" \
            --notes "$RELEASE_NOTES"
  build-macos:
    needs: prepare
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset mac-release -DNAM_PARAMETRIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset mac-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_AU NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test

      - name: Verify audio, calibration and control smoothing
        run: ctest --test-dir build/mac-release --output-on-failure -R '^(static_export|hyper_a2_engine|ir_normalization)$'

      - name: Package artifacts
        run: |
          set -euo pipefail
          ARTEFACT_DIR="build/mac-release/NamParametricPlugin_artefacts/Release"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for entry in Standalone/app VST3/vst3 AU/component; do
            format="${entry%/*}"
            extension="${entry#*/}"
            lipo "${ARTEFACT_DIR}/$format/NAM Parametric Plugin.$extension/Contents/MacOS/NAM Parametric Plugin" -verify_arch arm64 x86_64
          done

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/Standalone/NAM Parametric Plugin.app" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-Standalone.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/VST3/NAM Parametric Plugin.vst3" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-VST3.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/AU/NAM Parametric Plugin.component" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-AU.zip"

      - name: Upload tested packages directly to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist/*.zip

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-release -DNAM_PARAMETRIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test

      - name: Verify audio, calibration and control smoothing
        run: ctest --test-dir build/windows-release --output-on-failure -R '^(static_export|hyper_a2_engine|ir_normalization)$'

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artefactDir = "build/windows-release/NamParametricPlugin_artefacts/Release"
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $info = (Get-Item -LiteralPath "$artefactDir/Standalone/NAM Parametric Plugin.exe").VersionInfo
          if ($info.FileVersion -ne $version -or $info.ProductVersion -ne $version) { throw 'Binary version mismatch' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Compress-Archive -Path "$artefactDir/Standalone/NAM Parametric Plugin.exe", "$artefactDir/Standalone/THIRD-PARTY-NOTICES.md", "$artefactDir/Standalone/CREDITS.md" `
            -DestinationPath "dist/NAM-Parametric-Plugin-$version-Windows-Standalone.zip"

          Compress-Archive -Path "$artefactDir/VST3/NAM Parametric Plugin.vst3" `
            -DestinationPath "dist/NAM-Parametric-Plugin-$version-Windows-VST3.zip"

      - name: Upload tested packages directly to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" dist/*.zip

  build-linux:
    needs: prepare
    uses: ./.github/workflows/linux-build.yml
    with:
      source_ref: ${{ github.ref }}
      release_tag: ${{ github.ref_name }}
      upload_release: true

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Publish only after all seven native packages pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          pages = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/releases', '--paginate', '--slurp']))
          matches = [r for page in pages for r in page if r['tag_name'] == tag]
          assert len(matches) == 1
          release = matches[0]
          assert release['draft'] and release['target_commitish'] == os.environ['GITHUB_SHA']
          prefix = f'NAM-Parametric-Plugin-{tag[1:]}-'
          expected = {prefix + suffix for suffix in (
              'Windows-Standalone.zip', 'Windows-VST3.zip',
              'macOS-Standalone.zip', 'macOS-VST3.zip', 'macOS-AU.zip',
              'Linux-x86_64-Standalone.tar.gz', 'Linux-x86_64-VST3.tar.gz')}
          assert {a['name'] for a in release['assets']} == expected
          assert all(a['state'] == 'uploaded' and a['size'] > 0 for a in release['assets'])
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease', '--latest=false'], check=True)
          PY
