name: Draft 0.5.1 — Eco 20 ms limiter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-v051.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.5.1 draft only, pinned to this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            # NAM Parametric Plugin 0.5.1

            This is a **draft release**. It remains unpublished for testing and review.

            ## Eco de-click: bounded hypernetwork updates

            - **20 ms minimum interval between weight recalculations** in Eco mode, measured using model-audio samples rather than wall time or the GUI timer.
            - The first control change applies immediately. Additional knob/switch movements during the cooldown are coalesced: **only the latest complete parameter vector** is applied at the next eligible audio block.
            - The existing 5 ms de-click correction remains enabled to suppress boundary transients. No added audio delay or lookahead is introduced.
            - **Linear Volume stays independent**: sample-smoothed output attenuation does not trigger a hypernetwork update and is not rate-limited.
            - **Crossfade is unchanged**: two-network 50 ms transitions continue to operate as before.
            - Session restore, first load and Reset settle on the requested settings without waiting for a cooldown.

            The throttle limits the **frequency** of recalculation, not the CPU cost of an individual reconditioning operation, which still occurs on the audio-processing thread. During rapid automation a requested setting may be applied up to approximately 20 ms plus one model processing block later. Audio quality should be evaluated with different models; the 5 ms de-click cannot guarantee artifact-free transitions for every nonlinear model.

            ## Compatibility and other improvements

            - The 0.5.0 changes remain included: ParametricSlimmableContainer Full/Lite, extended `index` UI ordering for neural controls and Linear Volume, corrected IR normalization, legacy PNAM support, calibration, session recall and static NAM exports.
            - Neural parameters retain their original model-conditioning positions; only the **visual layout** follows optional `config.params[].index` metadata.
            - Added deterministic tests of the 20 ms cooldown, latest-value retention, exact settled audio, existing Eco/Crossfade transitions, HyperA2 Full/Lite, and audio regression.

            ## Native downloads

            Seven native packages are built from **one exact source commit** after native checks:

            - **Windows x64** — VST3 and Standalone
            - **macOS universal (Apple Silicon / Intel)** — VST3, AU and Standalone
            - **Linux x86_64** — VST3 and Standalone

            Windows/macOS binaries are unsigned and not notarized. See the [README](https://github.com/DLC86/NamParametricPlugin#download).

            This draft follows [v0.5.0](https://github.com/DLC86/NamParametricPlugin/releases/tag/v0.5.0). **Do not publish without explicit approval.**
        run: |
          set -euo pipefail
          grep -Fx "project(NamParametricPlugin VERSION 0.5.1)" CMakeLists.txt
          if gh api "repos/$GH_REPO/git/ref/tags/v0.5.1" >/dev/null 2>&1; then
            echo "Refusing to move an existing v0.5.1 tag" >&2
            exit 1
          fi
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref=refs/tags/v0.5.1 -f sha="$GITHUB_SHA" >/dev/null
          gh release create v0.5.1 --verify-tag --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "NAM Parametric Plugin 0.5.1" \
            --notes "$RELEASE_NOTES"
          echo "Created v0.5.1 draft for $GITHUB_SHA"
  build-macos:
    needs: prepare
    runs-on: macos-15-intel

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset mac-release -DNAM_PARAMETRIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset mac-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_AU NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test

      - name: Verify audio, calibration and control smoothing
        run: ctest --test-dir build/mac-release --output-on-failure -R '^(static_export|hyper_a2_engine|ir_normalization)$'

      - name: Package artifacts
        run: |
          set -euo pipefail
          ARTEFACT_DIR="build/mac-release/NamParametricPlugin_artefacts/Release"
          VERSION="0.5.1"
          mkdir -p dist
          for entry in Standalone/app VST3/vst3 AU/component; do
            format="${entry%/*}"
            extension="${entry#*/}"
            lipo "${ARTEFACT_DIR}/$format/NAM Parametric Plugin.$extension/Contents/MacOS/NAM Parametric Plugin" -verify_arch arm64 x86_64
          done

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/Standalone/NAM Parametric Plugin.app" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-Standalone.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/VST3/NAM Parametric Plugin.vst3" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-VST3.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/AU/NAM Parametric Plugin.component" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-AU.zip"

      - name: Upload tested packages directly to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.5.1 dist/*.zip

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-release -DNAM_PARAMETRIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test

      - name: Verify audio, calibration and control smoothing
        run: ctest --test-dir build/windows-release --output-on-failure -R '^(static_export|hyper_a2_engine|ir_normalization)$'

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artefactDir = "build/windows-release/NamParametricPlugin_artefacts/Release"
          $version = "0.5.1"
          $info = (Get-Item -LiteralPath "$artefactDir/Standalone/NAM Parametric Plugin.exe").VersionInfo
          if ($info.FileVersion -ne $version -or $info.ProductVersion -ne $version) { throw 'Binary version mismatch' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Compress-Archive -Path "$artefactDir/Standalone/NAM Parametric Plugin.exe", "$artefactDir/Standalone/THIRD-PARTY-NOTICES.md", "$artefactDir/Standalone/CREDITS.md" `
            -DestinationPath "dist/NAM-Parametric-Plugin-$version-Windows-Standalone.zip"

          Compress-Archive -Path "$artefactDir/VST3/NAM Parametric Plugin.vst3" `
            -DestinationPath "dist/NAM-Parametric-Plugin-$version-Windows-VST3.zip"

      - name: Upload tested packages directly to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload v0.5.1 dist/*.zip

  build-linux:
    needs: prepare
    uses: ./.github/workflows/linux-build.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: v0.5.1
      upload_release: true

  verify-draft:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all seven uploaded release assets and preserve draft status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GH_REPO']
          releases = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/releases', '--paginate', '--slurp']))
          matches = [r for page in releases for r in page if r['tag_name'] == 'v0.5.1']
          assert len(matches) == 1, 'Missing unique v0.5.1 release'
          release = matches[0]
          assert release['draft'] and release['prerelease'], 'Draft must remain unpublished'
          assert release['target_commitish'] == os.environ['GITHUB_SHA']
          tag = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/git/ref/tags/v0.5.1']))
          assert tag['object']['sha'] == os.environ['GITHUB_SHA']
          prefix = 'NAM-Parametric-Plugin-0.5.1-'
          expected = {prefix + suffix for suffix in (
              'Windows-Standalone.zip', 'Windows-VST3.zip',
              'macOS-Standalone.zip', 'macOS-VST3.zip', 'macOS-AU.zip',
              'Linux-x86_64-Standalone.tar.gz', 'Linux-x86_64-VST3.tar.gz')}
          assert {asset['name'] for asset in release['assets']} == expected
          assert all(asset['state'] == 'uploaded' and asset['size'] > 100000
                     for asset in release['assets'])
          for asset in sorted(release['assets'], key=lambda a: a['name']):
              print(asset['name'], asset['size'])
          print('Success: seven verified packages, draft unchanged')
          PY
