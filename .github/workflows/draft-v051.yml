name: Draft 0.5.1 — verified linear 100/100 ms
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-v051.yml'
  workflow_dispatch:

permissions:
  contents: write

# A source commit change invalidates every binary from any earlier attempt.
concurrency:
  group: v051-draft-native-packages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retarget the existing 0.5.1 draft and tag to tested main source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -Fx "project(NamParametricPlugin VERSION 0.5.1)" CMakeLists.txt
          # Draft releases aren't returned by /releases/tags/: use the known
          # existing draft ID and validate its tag, draft and prerelease flags.
          gh api "repos/$GH_REPO/releases/441587605" > /tmp/release.json
          python3 - <<'PY'
          import json
          release=json.load(open('/tmp/release.json'))
          assert release['id']==441587605, 'Unexpected draft ID'
          assert (release['tag_name']=='v0.5.1' or
                  release['tag_name'].startswith('untagged-')), 'Unexpected draft tag'
          assert release['draft'], 'Refusing to update a published release'
          assert release['prerelease'], 'Refusing to clear draft prerelease status'
          print("Updating existing draft release",release['id'])
          PY
          # Update GitHub's existing lightweight release tag without creating
          # an additional release. All seven packages will use GITHUB_SHA.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v0.5.1" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          release_id=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["id"])')
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="v0.5.1" \
            -f target_commitish="$GITHUB_SHA" \
            -f body="$(cat docs/release-0.5.1.md)" \
            -F draft=true -F prerelease=true >/dev/null
          gh api "repos/$GH_REPO/releases/$release_id" > /tmp/updated-release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/updated-release.json'))
          assert r['tag_name']=='v0.5.1', 'Draft lost the v0.5.1 tag'
          assert r['target_commitish']==os.environ['GITHUB_SHA'], 'Wrong release target'
          assert r['draft'] and r['prerelease'], 'Release must stay a draft'
          PY
          echo "Draft v0.5.1 retargeted to $GITHUB_SHA without publishing."
  build-macos:
    needs: prepare
    runs-on: macos-15-intel

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset mac-release -DNAM_PARAMETRIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset mac-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_AU NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test

      - name: Verify audio, calibration and control smoothing
        run: ctest --test-dir build/mac-release --output-on-failure -R '^(static_export|hyper_a2_engine|ir_normalization)$'

      - name: Package artifacts
        run: |
          set -euo pipefail
          ARTEFACT_DIR="build/mac-release/NamParametricPlugin_artefacts/Release"
          VERSION="0.5.1"
          mkdir -p dist
          for entry in Standalone/app VST3/vst3 AU/component; do
            format="${entry%/*}"
            extension="${entry#*/}"
            lipo "${ARTEFACT_DIR}/$format/NAM Parametric Plugin.$extension/Contents/MacOS/NAM Parametric Plugin" -verify_arch arm64 x86_64
          done

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/Standalone/NAM Parametric Plugin.app" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-Standalone.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/VST3/NAM Parametric Plugin.vst3" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-VST3.zip"

          ditto -c -k --sequesterRsrc --keepParent \
            "${ARTEFACT_DIR}/AU/NAM Parametric Plugin.component" \
            "dist/NAM-Parametric-Plugin-${VERSION}-macOS-AU.zip"

      - name: Upload tested packages directly to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.5.1 dist/*.zip --clobber

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-release -DNAM_PARAMETRIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test

      - name: Verify audio, calibration and control smoothing
        run: ctest --test-dir build/windows-release --output-on-failure -R '^(static_export|hyper_a2_engine|ir_normalization)$'

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artefactDir = "build/windows-release/NamParametricPlugin_artefacts/Release"
          $version = "0.5.1"
          $info = (Get-Item -LiteralPath "$artefactDir/Standalone/NAM Parametric Plugin.exe").VersionInfo
          if ($info.FileVersion -ne $version -or $info.ProductVersion -ne $version) { throw 'Binary version mismatch' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Compress-Archive -Path "$artefactDir/Standalone/NAM Parametric Plugin.exe", "$artefactDir/Standalone/THIRD-PARTY-NOTICES.md", "$artefactDir/Standalone/CREDITS.md" `
            -DestinationPath "dist/NAM-Parametric-Plugin-$version-Windows-Standalone.zip"

          Compress-Archive -Path "$artefactDir/VST3/NAM Parametric Plugin.vst3" `
            -DestinationPath "dist/NAM-Parametric-Plugin-$version-Windows-VST3.zip"

      - name: Upload tested packages directly to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload v0.5.1 dist/*.zip --clobber

  build-linux:
    needs: prepare
    uses: ./.github/workflows/linux-build.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: v0.5.1
      upload_release: true

  verify-draft:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all seven uploaded release assets and preserve draft status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GH_REPO']
          releases = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/releases', '--paginate', '--slurp']))
          matches = [r for page in releases for r in page if r['tag_name'] == 'v0.5.1']
          assert len(matches) == 1, 'Missing unique v0.5.1 release'
          release = matches[0]
          assert release['draft'] and release['prerelease'], 'Draft must remain unpublished'
          assert release['target_commitish'] == os.environ['GITHUB_SHA']
          tag = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/git/ref/tags/v0.5.1']))
          assert tag['object']['sha'] == os.environ['GITHUB_SHA']
          prefix = 'NAM-Parametric-Plugin-0.5.1-'
          expected = {prefix + suffix for suffix in (
              'Windows-Standalone.zip', 'Windows-VST3.zip',
              'macOS-Standalone.zip', 'macOS-VST3.zip', 'macOS-AU.zip',
              'Linux-x86_64-Standalone.tar.gz', 'Linux-x86_64-VST3.tar.gz')}
          assert {asset['name'] for asset in release['assets']} == expected
          assert all(asset['state'] == 'uploaded' and asset['size'] > 100000
                     for asset in release['assets'])
          for asset in sorted(release['assets'], key=lambda a: a['name']):
              print(asset['name'], asset['size'])
          print('Success: seven verified packages, draft unchanged')
          PY

  cleanup-branches:
    needs: verify-draft
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded smoothing experiments after release verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in experiment/direct-kernel-weight-smoothing experiment/offline-sample-weight-smoothing; do
            if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              echo "Removed $branch after seven native assets were verified"
            fi
          done
