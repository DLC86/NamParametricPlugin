name: Publish NAM Parametric Plugin v0.5.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.5.0.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-v0.5.0
  cancel-in-progress: false

jobs:
  dispatch-native-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release inputs
        run: |
          grep -Fx "project(NamParametricPlugin VERSION 0.5.0)" CMakeLists.txt
          test -s docs/release-0.5.0.md
      - name: Create immutable version tag and dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.5.0
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq ".object.sha" 2>/dev/null || true)
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA" || { echo "Tag already exists at a different commit" >&2; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched release.yml for $TAG at $GITHUB_SHA"
