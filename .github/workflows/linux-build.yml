name: Linux packages
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        default: ""
        type: string
      upload_release:
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Use pinned Eigen GitHub mirror (GitLab outage workaround)
        shell: bash
        run: git config --global url."https://github.com/eigenteam/eigen-git-mirror.git".insteadOf "https://gitlab.com/libeigen/eigen"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb xauth
      - name: Configure
        run: >-
          cmake -S . -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld
          -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DNAM_PARAMETRIC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/linux-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_Standalone static_export_test hyper_a2_engine_test ir_normalization_test
      - name: Verify export and unity IR gain
        run: xvfb-run -a ctest --test-dir build/linux-release --verbose -R "^(static_export|hyper_a2_engine|ir_normalization)$"
      - name: Check runtime libraries and package
        run: |
          set -euo pipefail
          root=build/linux-release/NamParametricPlugin_artefacts/Release
          version=$(sed -n 's/^project(NamParametricPlugin VERSION \([^)]*\)).*/\1/p' CMakeLists.txt)
          mkdir -p dist
          for binary in "$root/Standalone/NAM Parametric Plugin" \
            "$root/VST3/NAM Parametric Plugin.vst3/Contents/x86_64-linux/NAM Parametric Plugin.so"; do
            file "$binary" | grep 'ELF 64-bit.*x86-64'
            ldd "$binary" | tee -a dist/runtime-libraries.txt
          done
          if grep -q 'not found' dist/runtime-libraries.txt; then exit 1; fi
          tar -czf "dist/NAM-Parametric-Plugin-$version-Linux-x86_64-Standalone.tar.gz" \
            -C "$root/Standalone" 'NAM Parametric Plugin' THIRD-PARTY-NOTICES.md
          tar -czf "dist/NAM-Parametric-Plugin-$version-Linux-x86_64-VST3.tar.gz" \
            -C "$root/VST3" 'NAM Parametric Plugin.vst3'
          for package in dist/*.tar.gz; do tar -tzf "$package"; done
      - name: Attach Linux packages to the matching release
        if: inputs.upload_release
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pages = json.loads((Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text())
          matches = [r for page in pages for r in page if r['tag_name'] == os.environ['RELEASE_TAG']]
          assert len(matches) == 1
          release = matches[0]
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert release['target_commitish'] == revision, 'Release and binary source must match'
          PY
          gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
      - name: Preserve packages and runtime report
        if: always() && !inputs.upload_release
        uses: actions/upload-artifact@v4
        continue-on-error: ${{ inputs.upload_release }}
        with:
          name: linux-artifacts
          path: dist/*
          if-no-files-found: warn
