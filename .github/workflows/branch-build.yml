name: Branch Build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing draft release tag for verified macOS packages
        required: false
        default: ""
        type: string
      linux_only:
        description: Build Linux only
        type: boolean
        default: false
      linux_release_tag:
        description: Optional published release tag to build and attach Linux packages
        type: string
        default: ""
  push:
    branches: [main, codex/hyper-a2-support]
    paths:
      - '.github/workflows/branch-build.yml'
      - '.github/workflows/linux-build.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Tests/**'
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.release_tag && !inputs.linux_only && !inputs.linux_release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
            artifact: Windows-x64
          - os: macos-15-intel
            preset: mac-release
            artifact: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNAM_PARAMETRIC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: Verify export, model compatibility and unity IR gain
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure -R "^(static_export|hyper_a2_engine|ir_normalization)$"
      - name: Upload export validation files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Export-Validation
          path: build/${{ matrix.preset }}/static-export-results/**
          if-no-files-found: ignore
      - name: Package macOS bundles
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/mac-release/NamParametricPlugin_artefacts/Release/Standalone/NAM Parametric Plugin.app" dist/macOS-Standalone.zip
          ditto -c -k --sequesterRsrc --keepParent "build/mac-release/NamParametricPlugin_artefacts/Release/VST3/NAM Parametric Plugin.vst3" dist/macOS-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "build/mac-release/NamParametricPlugin_artefacts/Release/AU/NAM Parametric Plugin.component" dist/macOS-AU.zip
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/windows-release/NamParametricPlugin_artefacts/Release/Standalone/**
            build/windows-release/NamParametricPlugin_artefacts/Release/VST3/**
          if-no-files-found: error
  build_linux:
    if: ${{ !inputs.release_tag }}
    permissions:
      contents: write
    uses: ./.github/workflows/linux-build.yml
    with:
      source_ref: ${{ inputs.linux_release_tag || github.ref }}
      release_tag: ${{ inputs.linux_release_tag || '' }}
      upload_release: ${{ inputs.linux_release_tag != '' }}
  publish_mac:
    if: ${{ inputs.release_tag }}
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          submodules: recursive
      - name: Verify draft release and source revision
        run: |
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected a version tag'
          root = Path(os.environ['RUNNER_TEMP'])
          releases = [r for page in json.loads((root / 'releases.json').read_text()) for r in page]
          matches = [r for r in releases if r['tag_name'] == tag and r['draft']]
          assert len(matches) == 1, 'Expected one matching draft release'
          release = matches[0]
          (root / 'release.json').write_text(json.dumps(release))
          assert release['draft'] and release['tag_name'] == tag, 'Only draft releases may be updated'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert release['target_commitish'] == revision, 'Release and binary source must match'
          assert f'VERSION {tag[1:]})' in Path('CMakeLists.txt').read_text()
          PY
      - name: Install Ninja
        run: brew install ninja
      - name: Configure universal build
        run: cmake --preset mac-release -DNAM_PARAMETRIC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset mac-release --parallel 3 --target NamParametricPlugin_VST3 NamParametricPlugin_AU NamParametricPlugin_Standalone static_export_test
      - name: Verify export, calibration and smooth controls
        run: ctest --test-dir build/mac-release -C Release --output-on-failure -R '^static_export$'
      - name: Package universal bundles
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root=build/mac-release/NamParametricPlugin_artefacts/Release
          mkdir -p dist
          for format in Standalone VST3 AU; do
            case "$format" in
              Standalone) extension=app ;;
              VST3) extension=vst3 ;;
              AU) extension=component ;;
            esac
            bundle="$root/$format/NAM Parametric Plugin.$extension"
            ditto -c -k --sequesterRsrc --keepParent "$bundle" \
              "dist/NAM-Parametric-Plugin-$version-macOS-$format.zip"
          done
      - name: Attach verified packages directly to draft release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          repo = os.environ['GH_REPO']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json'}
          for package in sorted(Path('dist').glob('*.zip')):
              data = package.read_bytes()
              url = (f'https://uploads.github.com/repos/{repo}/releases/{release["id"]}/assets?name='
                     + urllib.parse.quote(package.name))
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, data=data, method='POST',
                          headers={**headers, 'Content-Type': 'application/zip'})
                      with urllib.request.urlopen(request, timeout=180) as response:
                          asset = json.load(response)
                      assert asset['state'] == 'uploaded' and asset['size'] == len(data)
                      if asset.get('digest'):
                          assert asset['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest()
                      print(package.name, asset['state'], asset['size'])
                      break
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(5)
          PY
      - name: Verify universal executable architectures
        run: |
          set -euo pipefail
          root=build/mac-release/NamParametricPlugin_artefacts/Release
          for entry in Standalone/app VST3/vst3 AU/component; do
            format="${entry%/*}"
            extension="${entry#*/}"
            executable="$root/$format/NAM Parametric Plugin.$extension/Contents/MacOS/NAM Parametric Plugin"
            lipo "$executable" -verify_arch arm64 x86_64
          done
      - name: Preserve packaged bundles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macOS-release-packages
          path: dist/*.zip
          if-no-files-found: ignore
